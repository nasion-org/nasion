[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "nasion"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
dynamic = ["version"]

[dependency-groups]
dev = [
    "maturin==1.16.0",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
required-version = "==0.12.1"

[tool.maturin]
manifest-path = "crates/nasion-py/Cargo.toml"
python-source = "python"
python-packages = ["nasion"]
module-name = "nasion._nasion"
# The toolchain pin travels in the sdist, so a wheel built from it compiles
# with the pinned toolchain, not the builder's default (D66).
include = [{ path = "rust-toolchain.toml", format = "sdist" }]

[tool.ruff]
target-version = "py311"
src = ["python"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "T20", "N", "SIM", "PT", "RUF", "ANN", "LOG", "G"]

[tool.ruff.lint.per-file-ignores]
# pytest reports failures through plain assert, so S101 does not apply to tests.
"python/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "python"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
